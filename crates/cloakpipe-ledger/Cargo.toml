[package]
name = "cloakpipe-ledger"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["ledger", "audit", "hash-chain", "ed25519", "evidence"]
categories = ["cryptography"]
description = "Verifiable evidence ledger: hash-chained, signed, no-PII records for CloakPipe"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rusqlite = { workspace = true }
tracing = { workspace = true }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = { workspace = true }
zeroize = { workspace = true }
tempfile = "3"
cloakpipe-anchor = { path = "../cloakpipe-anchor", version = "0.13.0" }
# The audit pack's tar writer (the same code the verifier reads it with).
cloakpipe-verify = { path = "../cloakpipe-verify", version = "0.13.0" }

[dev-dependencies]
proptest = "1"
cloakpipe-verify = { path = "../cloakpipe-verify" }
cloakpipe-anchor = { path = "../cloakpipe-anchor", features = ["testkit"] }

[[bin]]
name = "ledger-export-fixture"
path = "bin/export-fixture.rs"