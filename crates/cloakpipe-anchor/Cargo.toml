[package]
name = "cloakpipe-anchor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["rfc3161", "rekor", "transparency-log", "merkle", "timestamp"]
categories = ["cryptography"]
description = "External anchoring for CloakPipe evidence bundles — Merkle batching, RFC-3161 TSA, transparency-log submission"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core", "digest"] }
uuid = { workspace = true }
rand = { workspace = true }
base64 = "0.23"
reqwest = { workspace = true, features = ["blocking"] }
# The external anchors are verified before a receipt is returned, with the
# same standalone code an auditor runs.
cloakpipe-verify = { path = "../cloakpipe-verify", version = "0.14.0" }
# `testkit` only: local TSA and Rekor stand-ins for tests (same versions the
# verifier already uses, so nothing new is built).
der = { version = "0.7", features = ["alloc", "derive", "oid"], optional = true }
spki = { version = "0.7", features = ["alloc"], optional = true }
x509-cert = { version = "0.2", default-features = false, optional = true }
cms = { version = "0.2", optional = true }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"], optional = true }

[features]
default = []
# `cloakpipe_anchor::testkit`: MockTsa and MockRekor, for tests only.
testkit = ["dep:der", "dep:spki", "dep:x509-cert", "dep:cms", "dep:p256"]

[dev-dependencies]
tempfile = "3"
