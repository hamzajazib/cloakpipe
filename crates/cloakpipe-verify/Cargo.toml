[package]
name = "cloakpipe-verify"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true
description = "Standalone verifier for CloakPipe evidence bundles and release audit packs — no dependency on evidence producers"

[[bin]]
name = "cloakpipe-verify"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
anyhow = "1"
thiserror = "1"
# Release audit packs (`release-pack`): the manifest hash and certification
# attestations are checked with the spec crates, not re-implemented. Neither
# is a producer of ledger evidence; the ledger section is still verified by
# this crate's own code, with no dependency on `cloakpipe-ledger`.
cloakpipe-release = { path = "../cloakpipe-release", version = "0.10.0" }
cloakpipe-cert = { path = "../cloakpipe-cert", version = "0.10.0" }
serde_json_canonicalizer = "0.3"
base64 = "0.23"
chrono = { workspace = true }

[dev-dependencies]
tempfile = "3"
# Test-only: the gate tests (M3, M4) construct anchored bundles from
# scratch using the producer crates, then run the *standalone*
# verifier against them. The verifier's lib does NOT depend on these.
cloakpipe-anchor = { path = "../cloakpipe-anchor" }
cloakpipe-ledger = { path = "../cloakpipe-ledger" }
uuid = { workspace = true }