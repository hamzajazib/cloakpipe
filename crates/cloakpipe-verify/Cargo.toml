[package]
name = "cloakpipe-verify"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["verifier", "audit", "rfc3161", "rekor", "ed25519"]
categories = ["cryptography", "command-line-utilities"]
description = "Standalone verifier for CloakPipe evidence bundles and release audit packs — no dependency on evidence producers"

[[bin]]
name = "cloakpipe-verify"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["oid"] }
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core", "digest", "pkcs8"] }
anyhow = "1"
thiserror = "1"
# External anchoring (RFC 3161 tokens, Rekor entries), verified offline.
# The 0.7-generation RustCrypto stack: the newest set with stable releases
# of every crate (cms 0.3 and rsa 0.10 are still pre-releases).
der = { version = "0.7", features = ["alloc", "derive", "oid", "pem"] }
spki = { version = "0.7", features = ["alloc", "pem"] }
x509-cert = { version = "0.2", default-features = false, features = ["pem"] }
cms = "0.2"
rsa = { version = "0.9", default-features = false, features = ["std"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
sha1 = { version = "0.10", features = ["oid"] }
base64 = "0.23"
# Release audit packs (`release-pack` feature, off by default): the manifest
# hash and certification attestations are checked with the spec crates, not
# re-implemented. Neither is a producer of ledger evidence; the ledger
# section is still verified by this crate's own code, with no dependency on
# `cloakpipe-ledger`. Off by default so the evidence verifier (and the gate,
# which depends on it through the ledger) carries no certification code.
cloakpipe-release = { path = "../cloakpipe-release", version = "0.13.0", optional = true }
cloakpipe-cert = { path = "../cloakpipe-cert", version = "0.13.0", optional = true }
serde_json_canonicalizer = { version = "0.3", optional = true }
chrono = { workspace = true, optional = true }

[features]
default = []
# `cloakpipe-verify release-pack` and the `pack` module.
release-pack = ["dep:cloakpipe-release", "dep:cloakpipe-cert", "dep:serde_json_canonicalizer", "dep:chrono"]

[dev-dependencies]
tempfile = "3"
# Test-only: the gate tests (M3, M4) construct anchored bundles from
# scratch using the producer crates, then run the *standalone*
# verifier against them. The verifier's lib does NOT depend on these.
cloakpipe-anchor = { path = "../cloakpipe-anchor", features = ["testkit"] }
cloakpipe-ledger = { path = "../cloakpipe-ledger" }
uuid = { workspace = true }
chrono = { workspace = true }

[[test]]
name = "release_pack"
required-features = ["release-pack"]

[[test]]
name = "release_pack_cli"
required-features = ["release-pack"]

[[test]]
name = "legacy_pack"
required-features = ["release-pack"]
