[package]
name = "cloakleak-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../cloakleak/README.md"
keywords = ["pii", "benchmark", "llm", "cli"]
categories = ["development-tools::testing"]
publish = false
description = "CloakLeak CLI: run a system under test against the public corpus and emit a scoreboard"

[[bin]]
name = "cloakleak"
path = "src/main.rs"

[dependencies]
cloakleak = { path = "../cloakleak", version = "0.11.0" }
anyhow = { workspace = true }
serde_json = { workspace = true }