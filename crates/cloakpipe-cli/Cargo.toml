[package]
name = "cloakpipe-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["mcp", "ai-agents", "policy", "security", "cli"]
categories = ["command-line-utilities", "development-tools"]
description = "The cloakpipe binary: self-hosted policy-enforcement gate for AI agent tool calls, with its evidence ledger and verifier"

[[bin]]
name = "cloakpipe"
path = "src/main.rs"

[dependencies]
cloakpipe-core = { path = "../cloakpipe-core", version = "0.11.0", features = ["gliner-pii", "ner"] }
cloakpipe-proxy = { path = "../cloakpipe-proxy", version = "0.11.0" }
cloakpipe-audit = { path = "../cloakpipe-audit", version = "0.11.0" }
cloakpipe-tree = { path = "../cloakpipe-tree", version = "0.11.0" }
cloakpipe-vector = { path = "../cloakpipe-vector", version = "0.11.0" }
cloakpipe-mcp = { path = "../cloakpipe-mcp", version = "0.11.0" }
cloakpipe-release = { path = "../cloakpipe-release", version = "0.11.0" }
cloakpipe-cert = { path = "../cloakpipe-cert", version = "0.11.0" }
cloakpipe-receipt = { path = "../cloakpipe-receipt", version = "0.11.0" }
cloakpipe-anchor = { path = "../cloakpipe-anchor", version = "0.11.0" }
cloakpipe-ledger = { path = "../cloakpipe-ledger", version = "0.11.0" }
cloakpipe-verify = { path = "../cloakpipe-verify", version = "0.11.0", features = ["release-pack"] }
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"
chrono.workspace = true
serde_yaml = "0.9"
tokio.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
dialoguer.workspace = true
shell-words = "1"
uuid.workspace = true

[features]
# Legacy (source only, off by default): `mcp-proxy` takes --certification,
# --trust, --trust-key, --revoked-statement, --revoked-key and --environment
# and refuses every call unless the release holds a certification that
# verifies now. Removed in a later release.
certification = ["cloakpipe-mcp/certification"]

[dev-dependencies]
rusqlite = { workspace = true }
tempfile = "3"
uuid.workspace = true
serde_json.workspace = true
base64 = "0.23"
sha2 = "0.10"
hex = "0.4"
