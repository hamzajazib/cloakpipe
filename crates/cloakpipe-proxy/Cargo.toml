[package]
name = "cloakpipe-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["llm", "proxy", "openai", "anthropic", "pii"]
categories = ["web-programming::http-server"]
description = "OpenAI- and Anthropic-compatible LLM egress proxy for CloakPipe: PII pseudonymization in requests, rehydration in responses"

[dependencies]
cloakpipe-core = { path = "../cloakpipe-core", version = "0.12.0" }
cloakpipe-audit = { path = "../cloakpipe-audit", version = "0.12.0" }
cloakpipe-tree = { path = "../cloakpipe-tree", version = "0.12.0", optional = true }
tokio.workspace = true
axum.workspace = true
hyper.workspace = true
reqwest.workspace = true
tower.workspace = true
chrono.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true
futures.workspace = true
async-stream.workspace = true
tracing.workspace = true
uuid.workspace = true
anyhow.workspace = true
http-body-util.workspace = true

[features]
default = []
# Neural NER detectors (ONNX Runtime + tokenizers, GLiNER-PII sidecar client).
# Off by default: the proxy detects PII with regex alone.
ner = ["cloakpipe-core/ner", "cloakpipe-core/gliner-pii"]
# RAG endpoints: /v1/embeddings and the CloakTree /tree/* routes.
rag = ["dep:cloakpipe-tree"]

[dev-dependencies]
tempfile = "3"
toml.workspace = true
