[package]
name = "cloakpipe-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["pii", "pseudonymization", "redaction", "llm", "privacy"]
categories = ["text-processing", "cryptography"]
description = "Regex PII detection, pseudonymization and rehydration engine for CloakPipe (NER behind the `ner` feature)"

[dependencies]
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
aes-gcm.workspace = true
zeroize.workspace = true
rand.workspace = true
anyhow.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
strsim.workspace = true
rusqlite.workspace = true

[dev-dependencies]
tempfile = "3"

[features]
default = []
ner = ["dep:ort", "dep:tokenizers"]
gliner-pii = ["dep:ureq"]

[dependencies.ort]
workspace = true
optional = true

[dependencies.tokenizers]
workspace = true
optional = true

[dependencies.ureq]
version = "2"
features = ["json"]
optional = true
