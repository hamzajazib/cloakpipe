[package]
name = "cloakpipe-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["mcp", "ai-agents", "policy", "gate", "llm"]
categories = ["development-tools"]
description = "MCP tool-call gate for CloakPipe: contract checks, approvals, side-effect tracking and evidence on every tools/call"

[dependencies]
cloakpipe-core = { path = "../cloakpipe-core", version = "0.12.0" }
cloakpipe-ledger = { path = "../cloakpipe-ledger", version = "0.12.0" }
cloakpipe-release = { path = "../cloakpipe-release", version = "0.12.0" }
cloakpipe-receipt = { path = "../cloakpipe-receipt", version = "0.12.0" }
cloakpipe-policy = { path = "../cloakpipe-policy", version = "0.12.0" }
# Legacy: only the `certification` feature verifies certification statements.
cloakpipe-cert = { path = "../cloakpipe-cert", version = "0.12.0", optional = true }
base64 = { version = "0.23", optional = true }
chrono = { workspace = true }
rmcp = { workspace = true }
# MCP over HTTP (Streamable HTTP): the listener and the upstream client;
# event delivery (webhooks, OTLP/HTTP) on the sinks' own threads (blocking).
axum = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4", "v5"] }
sha2 = "0.10"
hmac = "0.12"
rusqlite = { workspace = true }
rand = { workspace = true }

[features]
# Legacy (source only, off by default): the gate also refuses every call
# unless the release holds a certification that verifies now for the gate's
# environment (`ToolGate::with_certification`). Removed in a later release.
certification = ["dep:cloakpipe-cert", "dep:base64"]

[dev-dependencies]
rusqlite = { workspace = true }
tempfile = "3"
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
chrono = { workspace = true }
cloakpipe-verify = { path = "../cloakpipe-verify" }
