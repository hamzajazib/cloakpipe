[package]
name = "cloakpipe-cert"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["certification", "attestation", "in-toto", "dsse"]
categories = ["cryptography", "development-tools"]
description = "Legacy agent-release certification for CloakPipe (`certification` feature): evaluation runs, certification decisions, signed attestations"

[dependencies]
cloakpipe-release = { path = "../cloakpipe-release", version = "0.13.0" }
cloakpipe-receipt = { path = "../cloakpipe-receipt", version = "0.13.0" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
hex = "0.4"
thiserror = { workspace = true }
chrono = { workspace = true }
quick-xml = "0.42"
base64 = "0.23"
ed25519-dalek = { version = "2" }

[dev-dependencies]
proptest = "1"
