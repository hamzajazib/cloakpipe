name: CI

on:
  # Every pushed branch is tested, so stacked feature branches get CI before
  # their base merges; PRs into main are tested as merge commits too.
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build + test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Default features = the lean regex-only path (the OSS default). It must
      # compile and pass on its own, independent of the optional ner/gliner-pii.
      - name: Build core (default features)
        run: cargo build -p cloakpipe-core
      - name: Test core (default features)
        run: cargo test -p cloakpipe-core
      # Full workspace — cloakpipe-cli and cloakpipe-proxy pull in the
      # `ner` (ort + tokenizers) and `gliner-pii` features.
      - name: Build workspace
        run: cargo build --workspace
      - name: Test workspace
        run: cargo test --workspace
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  cloakleak-gate:
    name: cloakleak zero-leak gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build -p cloakleak-cli
      - name: Zero-leak gate (prose)
        run: |
          cargo run -q -p cloakleak-cli -- run --sut cloakpipe-regex --track prose > scoreboard-prose.json
          cat scoreboard-prose.json
      - name: Zero-leak gate (tool_json)
        run: |
          cargo run -q -p cloakleak-cli -- run --sut cloakpipe-regex --track tool_json > scoreboard-tool-json.json
          cat scoreboard-tool-json.json
      - name: Baselines reference (must report 100% leak)
        run: |
          cargo run -q -p cloakleak-cli -- baselines --track prose
          cargo run -q -p cloakleak-cli -- baselines --track tool_json
      - name: Upload scoreboards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloakleak-scoreboards
          path: |
            scoreboard-prose.json
            scoreboard-tool-json.json

  verifier-e2e:
    name: cloakpipe-verify end-to-end
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build all
        run: cargo build --workspace
      - name: Run ledger-export-fixture to produce a real v2 bundle
        run: |
          cargo run -q -p cloakpipe-ledger --bin ledger-export-fixture
          ls -la crates/cloakpipe-verify/tests/fixtures/
      - name: Verify the bundle (chain)
        run: |
          cargo run -q -p cloakpipe-verify -- chain crates/cloakpipe-verify/tests/fixtures/sample.bundle.json
      - name: Verify the bundle (sigs)
        run: |
          cargo run -q -p cloakpipe-verify -- sigs crates/cloakpipe-verify/tests/fixtures/sample.bundle.json
      - name: Verify the bundle (anchors) — must exit 0 for v1 bundle
        run: |
          cargo run -q -p cloakpipe-verify -- anchors crates/cloakpipe-verify/tests/fixtures/sample.bundle.json
      - name: Verify the bundle (proofs) — must exit 0 for v1 bundle
        run: |
          cargo run -q -p cloakpipe-verify -- proofs crates/cloakpipe-verify/tests/fixtures/sample.bundle.json
      - name: Verify the bundle (all) — must exit 0
        run: |
          cargo run -q -p cloakpipe-verify -- all crates/cloakpipe-verify/tests/fixtures/sample.bundle.json

  release-gate:
    name: agent release manifests
    runs-on: ubuntu-latest
    needs: test
    env:
      TESTDATA: crates/cloakpipe-release/testdata
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build -p cloakpipe-cli
      - name: Validate fixtures
        run: |
          for m in "$TESTDATA"/*.yaml "$TESTDATA"/*.json; do
            ./target/debug/cloakpipe release validate "$m"
          done
      - name: Golden hash is unchanged
        # A changed golden hash invalidates every release hash already issued.
        run: |
          got=$(./target/debug/cloakpipe release hash "$TESTDATA/support-agent-184.yaml")
          want=$(cat "$TESTDATA/support-agent-184.hash")
          echo "got  $got"; echo "want $want"
          test "$got" = "$want"
      - name: Rust and the reference implementation agree
        # tools/release_hash_reference.py is a stdlib-only reimplementation of
        # the spec; the manifest JSON is taken from the in-toto predicate.
        run: |
          for m in "$TESTDATA"/*.yaml "$TESTDATA"/*.json; do
            rust=$(./target/debug/cloakpipe release hash "$m")
            ./target/debug/cloakpipe release inspect --json "$m" \
              | python3 -c 'import json,sys; json.dump(json.load(sys.stdin)["predicate"], sys.stdout)' > /tmp/manifest.json
            ref=$(python3 tools/release_hash_reference.py /tmp/manifest.json)
            echo "$m  rust=$rust  ref=$ref"
            test "$rust" = "$ref"
          done
      - name: Invalid manifests are rejected
        run: |
          sed 's/support-answer@31/support-answer@latest/' "$TESTDATA/support-agent-184.yaml" > /tmp/mutable.yaml
          if ./target/debug/cloakpipe release hash /tmp/mutable.yaml; then
            echo "a mutable reference must not produce a hash"; exit 1
          fi
      - name: Diff reports required assurance
        run: |
          ./target/debug/cloakpipe release diff --json "$TESTDATA/support-agent-184.yaml" "$TESTDATA/support-agent-185.yaml" \
            | tee diff.json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["requires_approval"] and "trajectory" in d["required_suites"], d'

  certification-gate:
    name: agent release certification
    runs-on: ubuntu-latest
    needs: test
    env:
      FIXTURES: crates/cloakpipe-cli/tests/fixtures/certification
      MANIFEST: crates/cloakpipe-release/testdata/support-agent-184.yaml
      CP: ./target/debug/cloakpipe
      WORK: cert-work
      NOW: "2026-10-01T12:00:00Z"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build -p cloakpipe-cli
      - name: Generate a throwaway signing key
        run: |
          mkdir -p "$WORK"
          $CP release keygen --out "$WORK/key.json"
          test "$(stat -c %a "$WORK/key.json")" = 600
      - name: Import JUnit reports as evaluation runs
        run: |
          for r in passing failing; do
            $CP eval import --junit "$FIXTURES/$r.junit.xml" --release "$MANIFEST" \
              --suite support-critical@23 --covers privacy,functional --critical 'privacy::*' \
              --tool pytest --out "$WORK/$r.run.json"
          done
      - name: Certify the passing run (must exit 0)
        run: |
          $CP release certify "$MANIFEST" --policy "$FIXTURES/policy.yaml" --run "$WORK/passing.run.json" \
            --require privacy,functional --environment production --issuer "ci:${GITHUB_REPOSITORY}" \
            --key "$WORK/key.json" --now "$NOW" --out "$WORK/passing.cert.dsse.json"
      - name: Certify the failing run (must exit 1, BLOCKED)
        run: |
          set +e
          $CP release certify "$MANIFEST" --policy "$FIXTURES/policy.yaml" --run "$WORK/failing.run.json" \
            --require privacy,functional --environment production --issuer "ci:${GITHUB_REPOSITORY}" \
            --key "$WORK/key.json" --now "$NOW" --out "$WORK/failing.cert.dsse.json" | tee "$WORK/failing.txt"
          code=${PIPESTATUS[0]}
          set -e
          echo "exit $code"
          test "$code" -eq 1
          grep -q '^BLOCKED' "$WORK/failing.txt"
          grep -q 'new_critical_failure' "$WORK/failing.txt"
      - name: Verify the certification (must exit 0)
        run: |
          $CP release verify-cert "$WORK/passing.cert.dsse.json" --trust "$WORK/key.json" \
            --release "$MANIFEST" --now "2026-10-02T00:00:00Z"
      - name: A blocked decision and a tampered envelope must not verify
        run: |
          if $CP release verify-cert "$WORK/failing.cert.dsse.json" --trust "$WORK/key.json" --now "2026-10-02T00:00:00Z"; then
            echo "a BLOCKED decision must not verify as certified"; exit 1
          fi
          python3 - "$WORK/passing.cert.dsse.json" "$WORK/tampered.cert.dsse.json" <<'PY'
          import base64, json, sys
          env = json.load(open(sys.argv[1]))
          st = json.loads(base64.b64decode(env["payload"]))
          st["predicate"]["certification"]["environment"] = "anything"
          env["payload"] = base64.b64encode(json.dumps(st).encode()).decode()
          json.dump(env, open(sys.argv[2], "w"))
          PY
          set +e
          $CP release verify-cert "$WORK/tampered.cert.dsse.json" --trust "$WORK/key.json" --now "2026-10-02T00:00:00Z" | tee "$WORK/tampered.txt"
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -eq 1
          grep -q '^INVALID' "$WORK/tampered.txt"
      - name: Expose the key to the composite action
        id: key
        run: |
          echo "::add-mask::$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["privateKey"])' "$WORK/key.json")"
          {
            echo "json<<CLOAKPIPE_KEY_EOF"
            cat "$WORK/key.json"
            echo "CLOAKPIPE_KEY_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "$PWD/target/debug" >> "$GITHUB_PATH"
      - name: Certify through the composite action
        id: action
        uses: ./.github/actions/certify
        with:
          install: "false"
          manifest: ${{ env.MANIFEST }}
          policy: ${{ env.FIXTURES }}/policy.yaml
          runs: |
            ${{ env.WORK }}/passing.run.json
          require: privacy,functional
          environment: production
          signing-key: ${{ steps.key.outputs.json }}
          out: ${{ env.WORK }}/action.cert.dsse.json
      - name: Check the action's outputs
        env:
          OUTCOME: ${{ steps.action.outputs.outcome }}
          ENVELOPE: ${{ steps.action.outputs.envelope }}
        run: |
          test "$OUTCOME" = certified
          $CP release verify-cert "$ENVELOPE" --trust "$WORK/key.json" --release "$MANIFEST"
      - name: Upload certification envelopes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certification-envelopes
          path: ${{ env.WORK }}/*.cert.dsse.json

  audit-pack-gate:
    name: release audit pack
    runs-on: ubuntu-latest
    needs: test
    env:
      FIXTURES: crates/cloakpipe-cli/tests/fixtures/certification
      MANIFEST: crates/cloakpipe-release/testdata/support-agent-184.yaml
      CP: ./target/debug/cloakpipe
      VERIFY: ./target/debug/cloakpipe-verify
      WORK: pack-work
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build -p cloakpipe-cli -p cloakpipe-verify -p cloakpipe-ledger --bins
      - name: Evidence for one release (keys, run, certification, ledger export, events)
        run: |
          mkdir -p "$WORK"
          $CP release keygen --out "$WORK/exporter.key.json"
          $CP release keygen --out "$WORK/cert.key.json"
          $CP eval import --junit "$FIXTURES/passing.junit.xml" --release "$MANIFEST" \
            --suite support-critical@23 --covers privacy,functional --critical 'privacy::*' --out "$WORK/run.json"
          $CP release certify "$MANIFEST" --policy "$FIXTURES/policy.yaml" --run "$WORK/run.json" \
            --require privacy,functional --environment production --issuer ci:pack-gate \
            --key "$WORK/cert.key.json" --now 2026-10-01T00:00:00Z --out "$WORK/cert.dsse.json"
          ./target/debug/ledger-export-fixture "$WORK/ledger.json" "$($CP release hash "$MANIFEST")" "$WORK/ledger.pub.json"
          cat > "$WORK/events.json" <<'JSON'
          [
            {"type": "release_registered", "at": "2026-09-30T09:00:00Z", "actor": "ci:pack-gate", "agent": "support-agent", "version": "184"},
            {"type": "release_promoted", "at": "2026-10-02T00:00:00Z", "actor": "alice", "environment": "production"}
          ]
          JSON
      - name: Assemble the pack
        run: |
          $CP release audit-pack --manifest "$MANIFEST" --run "$WORK/run.json" --certification "$WORK/cert.dsse.json" \
            --ledger-export "$WORK/ledger.json" --events "$WORK/events.json" --key "$WORK/exporter.key.json" \
            --exporter ci:pack-gate --now 2026-10-10T00:00:00Z --out "$WORK/pack.json"
      - name: Verify the pack (must exit 0)
        run: |
          $VERIFY release-pack "$WORK/pack.json" --trust "$WORK/exporter.key.json" --trust "$WORK/ledger.pub.json" \
            --cert-trust "$WORK/cert.key.json" --now 2026-10-15T00:00:00Z
      - name: Tampered or inconsistent packs must exit 1
        run: |
          expect_fail() {
            set +e
            $VERIFY release-pack "$1" --trust "$WORK/exporter.key.json" --trust "$WORK/ledger.pub.json" \
              --cert-trust "$WORK/cert.key.json" --now 2026-10-15T00:00:00Z > "$1.txt"
            code=$?
            set -e
            cat "$1.txt"
            test "$code" -eq 1
            grep -q '^FAIL' "$1.txt"
          }
          # Any edit without the exporter's key breaks the digest and signature.
          python3 - "$WORK/pack.json" "$WORK/tampered.json" <<'PY'
          import json, sys
          p = json.load(open(sys.argv[1]))
          p["spec"]["governance"]["events"][1]["actor"] = "mallory"
          json.dump(p, open(sys.argv[2], "w"))
          PY
          expect_fail "$WORK/tampered.json"
          # A production promotion before the certification existed, signed
          # by the exporter itself, is still inconsistent.
          python3 - "$WORK/events.json" "$WORK/early.json" <<'PY'
          import json, sys
          e = json.load(open(sys.argv[1]))
          e[1]["at"] = "2026-09-30T12:00:00Z"
          json.dump(e, open(sys.argv[2], "w"))
          PY
          $CP release audit-pack --manifest "$MANIFEST" --run "$WORK/run.json" --certification "$WORK/cert.dsse.json" \
            --ledger-export "$WORK/ledger.json" --events "$WORK/early.json" --key "$WORK/exporter.key.json" \
            --now 2026-10-10T00:00:00Z --out "$WORK/early.pack.json"
          expect_fail "$WORK/early.pack.json"
      - name: Upload the pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-audit-pack
          path: ${{ env.WORK }}/pack.json

  v2-pr-summary:
    name: PR summary comment
    runs-on: ubuntu-latest
    needs: [test, cloakleak-gate, verifier-e2e, release-gate, certification-gate, audit-pack-gate]
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Post summary
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## v2 gate results

            - [x] build + test + clippy
            - [x] cloakleak zero-leak gate (prose + tool_json)
            - [x] cloakpipe-verify end-to-end (chain + sigs + anchors + proofs + all)
            - [x] agent release manifests (validate, golden hash, reference-implementation agreement, diff)
            - [x] agent release certification (keygen, eval import, certify pass/block, verify-cert, tamper rejection, composite action)
            - [x] release audit pack (assemble, verify, tamper and inconsistency rejection)

            See PR artifacts for the scoreboards.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  docker:
    # Validate the image builds. Gated to push (it's a full release build) so
    # routine PRs stay fast.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cloakpipe:ci .
